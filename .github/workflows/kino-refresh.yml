name: Refresh Kino
# Monthly: re-read the documentaries' Wikidata labels and image credits (Wikidata P18 and Wikimedia Commons licences)
# and rebuild kino/data/index.json and media.json. --refresh refetches cached entries older than 25 days; the cache is
# committed so that each run asks only for what is due.
on:
  schedule:
    - cron: '13 4 4 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kino-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node kino/scripts/build-index.mjs --refresh
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/kino.test.mjs
      # The deploy that follows runs package.json's whole "test" list on what this refresh commits. Its unit and data
      # tests run here first, on the same files and with the deploy's settings, so that a test elsewhere in the list that
      # the new data breaks stops this refresh (nothing is committed, the site keeps the last good data and goes on
      # publishing, and this run goes red, where the freshness check shows it) instead of every deploy after it.
      # Four files of the list (documentary, headlines, learning, platform) load playwright-core when they are read.
      - run: npm ci --ignore-scripts
      - name: Test the whole unit list on what this refresh would commit
        env:
          PRP_PAGES: '0'
          PRP_CPU_LIMIT_MS: '80'
        run: node tests/tools/run.mjs unit
      - uses: ./.github/actions/commit-data
        with:
          paths: kino/data/index.json kino/data/media.json kino/data/iso.json kino/scripts/cache.json
          message: 'Kino: monthly Wikidata and Commons refresh'
  # Tests the whole suite on main as this refresh left it, and deploys that commit only if it passed (pages-deploy.yml).
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    with:
      deploy: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
