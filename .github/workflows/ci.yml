name: Test and deploy
# Every push to main and every pull request: the whole suite (unit, data and page tests, in Microsoft Edge against
# a local copy of the site served like Cloudflare Pages), then, on main, a deploy of exactly the commit that passed.
# Both are pages-deploy.yml, which every deploy goes through. Pushes the data refreshes make with the Actions token never
# start this workflow; each refresh calls pages-deploy.yml itself. Run workflow here, on main, to test and deploy by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pipeline:
    uses: ./.github/workflows/pages-deploy.yml
    with:
      sha: ${{ github.sha }}
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    secrets: inherit
