name: Refresh National Analysis data
# World Bank indicators are revised several times a year; JDP-I's leadership and conflict data change monthly.
on:
  schedule:
    - cron: '47 3 5 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: national-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JudePettit/hp-retrospective
          path: hp-retrospective
      # Political Atlas names, for each country it covers, the office that holds the most power (its executive.leader):
      # the current leader is that office's holder.
      - uses: actions/checkout@v4
        with:
          repository: JudePettit/political-atlas
          path: political-atlas
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node national/scripts/build.mjs --retro hp-retrospective --atlas political-atlas
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/national.test.mjs tests/kino.test.mjs
      # The deploy that follows runs package.json's whole "test" list on what this refresh commits. Its unit and data
      # tests run here first, on the same files and with the deploy's settings, so that a test elsewhere in the list that
      # the new data breaks stops this refresh (nothing is committed, the site keeps the last good data and goes on
      # publishing, and this run goes red, where the freshness check shows it) instead of every deploy after it.
      # Four files of the list (documentary, headlines, learning, platform) load playwright-core when they are read.
      - run: npm ci --ignore-scripts
      - name: Test the whole unit list on what this refresh would commit
        env:
          PRP_PAGES: '0'
          PRP_CPU_LIMIT_MS: '80'
        run: node tests/tools/run.mjs unit
      - uses: ./.github/actions/commit-data
        with:
          paths: national/data
          message: 'National Analysis: monthly data refresh'
  # Tests the whole suite on main as this refresh left it, and deploys that commit only if it passed (pages-deploy.yml).
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    with:
      deploy: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
