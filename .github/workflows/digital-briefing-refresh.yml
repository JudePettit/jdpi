name: Refresh Digital Briefing
# Every six hours (02:10, 08:10, 14:10 and 20:10 UTC, a minute no other job uses, and soon after arXiv's nightly
# announcement): fetch every computing and technology feed and roll the seven-day store forward.
on:
  schedule:
    - cron: '10 2-23/6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: digital-briefing-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node digital/scripts/build-briefing.mjs
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/digital-briefing.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: digital/briefing/data
          message: 'Digital Briefing: refresh stories'
