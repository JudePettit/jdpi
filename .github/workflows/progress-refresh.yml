name: Refresh Invention Timeline
# Monthly: re-read the facts behind the curated breakthroughs from Wikidata (people, life dates, institutions, places)
# and rebuild science/progress/data/events.json. --refresh refetches cached items older than 25 days; the cache is
# committed so that each run asks Wikidata only for what is due.
on:
  schedule:
    # On the 2nd, a day before the Encyclopaedia refresh (3rd, 03:31), which reads this output and also leans on Wikidata.
    - cron: '37 4 2 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: progress-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node science/scripts/build-progress.mjs --refresh
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/science-progress.test.mjs tests/kino.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: science/progress/data science/scripts/progress-cache.json
          message: 'Invention Timeline: monthly Wikidata refresh'
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    secrets: inherit
