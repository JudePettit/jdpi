name: Refresh Encyclopaedia entity layer
# Rebuilds lake/data monthly: mentions from every module, Wikidata facts and tags, Wikipedia summaries. Then every
# Bibliotheca book is tagged again against the new lake (its casts are in it, bibliotheca/data/cast), so a book shows
# the terms the lake has learnt the day it learns them.
on:
  schedule:
    - cron: '31 3 3 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lake-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JudePettit/hp-retrospective
          path: hp-retrospective
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node lake/scripts/build.mjs --retro hp-retrospective
      - name: Tag every Bibliotheca book again
        run: for slug in $(node -p "require('./bibliotheca/data/index.json').books.map(b => b.slug).join(' ')"); do node bibliotheca/scripts/tag-terms.mjs "$slug" > /dev/null; done
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/encyclopedia.test.mjs tests/kino.test.mjs tests/bibliotheca-data.test.mjs tests/bibliotheca-cast.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: lake/data lake/scripts/summary-cache.json bibliotheca/data/books bibliotheca/data/index.json
          message: 'Encyclopaedia: monthly refresh of the entity layer, and the Bibliotheca books tagged against it'
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    secrets: inherit
