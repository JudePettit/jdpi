name: Refresh War Focus
# UCDP publishes candidate events monthly; this re-scores the ongoing wars and picks up new Wikidata battles.
on:
  schedule:
    - cron: '53 2 2 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: warfocus-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node battlefield/focus/scripts/build.mjs --cache /tmp/warfocus-src
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/warfocus.test.mjs tests/kino.test.mjs
      # Month by Month: each country's months from the GED file War Focus has just read (monthly/data/ged-countries.json),
      # and the marks again with War Focus's new month. Thrown away if it fails its tests; War Focus is committed anyway.
      - name: Rebuild Month by Month's country months from GED
        id: monthly
        continue-on-error: true
        run: node monthly/scripts/build.mjs --ged /tmp/warfocus-src
      - name: Test the new marks
        id: monthlytest
        if: steps.monthly.outcome == 'success'
        continue-on-error: true
        env:
          PRP_PAGES: '0'
        run: node --test tests/monthly.test.mjs
      - name: Throw away Month by Month's changes
        if: steps.monthly.outcome == 'failure' || steps.monthlytest.outcome == 'failure'
        run: |
          git checkout -- monthly/data
          git clean -fdq -- monthly/data
      # The marks kept must still pass their tests with War Focus's new files (they read them), or nothing is committed:
      # the deploy gate tests the whole suite on what a refresh leaves.
      - name: Test the marks kept with War Focus's new files
        if: steps.monthly.outcome == 'failure' || steps.monthlytest.outcome == 'failure'
        env:
          PRP_PAGES: '0'
        run: node --test tests/monthly.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: battlefield/focus/data monthly/data
          message: 'War Focus: refresh UCDP events and battles'
      - name: Fail the run if Month by Month was not committed
        if: steps.monthly.outcome == 'failure' || steps.monthlytest.outcome == 'failure'
        run: |
          echo "::error::The Month by Month rebuild or its tests failed (see those steps); War Focus was committed without it."
          exit 1
  # Tests the whole suite on main as this refresh left it, and deploys that commit only if it passed (pages-deploy.yml).
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    with:
      deploy: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
