<!doctype html>
<html lang="en" class="prp">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1318" media="(prefers-color-scheme: dark)">
  <title>PRP · Personal Resource Planner</title>
  <meta name="description" content="PRP, the Personal Resource Planner by JDP-Iq: Realtime Intelligence, Retrospective Intelligence, Money Management and Natural Science in one workspace.">
  <link rel="icon" href="design/brand-prp.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>/* Apply the saved theme and sidebar before first paint */try{var t=localStorage.getItem('prp.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('prp.sidebar')==='collapsed')document.documentElement.classList.add('side-collapsed')}catch(e){}</script>
  <link rel="stylesheet" href="design/prp.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <aside class="side" id="side" aria-label="PRP navigation">
      <a class="brand" href="#/">
        <img src="design/brand-prp.svg" alt="" width="32" height="32">
        <span><b>PRP</b><small>Personal Resource Planner</small></span>
      </a>
      <!-- The phone drawer's close button and, after the drawer, its scrim (shell.js, "Phone drawer") -->
      <button class="side-close" id="side-close" type="button" aria-label="Close navigation" title="Close navigation">✕</button>
      <div class="find">
        <input id="find" type="search" placeholder="Search PRP" autocomplete="off" aria-label="Search modules or the Encyclopaedia">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <nav id="nav" aria-label="Modules and submodules"></nav>
      <div class="side-foot">
        <div class="theme" role="group" aria-label="Theme">
          <button type="button" data-theme-choice="system" title="Follow your system setting">System</button>
          <button type="button" data-theme-choice="light">Light</button>
          <button type="button" data-theme-choice="dark">Dark</button>
        </div>
        <div class="legal" id="legal"></div>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main" id="main">
      <header class="top">
        <button class="menu" id="menu" type="button" aria-label="Open navigation" aria-controls="side" aria-expanded="false">☰</button>
        <!-- Above 900 px: hide the sidebar to give the page the whole width (shell.js, "Sidebar collapse") -->
        <button class="collapse" id="collapse" type="button" aria-controls="side" aria-expanded="true" aria-label="Hide navigation" title="Hide navigation (give the page the whole width)">⇤</button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <section class="view" id="view" aria-live="polite"></section>
      <section class="frames" id="frames" hidden></section>
      <!-- Kino's film while it follows along with its own frame hidden (shell.js, "Kino now playing") -->
      <section class="kino-np" id="np" aria-label="Now playing in Kino" hidden>
        <p class="np-head"><b class="np-k">Kino</b><span class="np-sep" aria-hidden="true">·</span><span class="np-title" id="np-title"></span><span class="np-sep" aria-hidden="true">·</span><span class="np-n" id="np-n"></span></p>
        <p class="np-cap" id="np-cap" lang="en-GB" aria-live="polite" aria-atomic="true"></p>
        <div class="np-ctrl" role="group" aria-label="Film controls">
          <button type="button" class="np-btn" id="np-prev" aria-label="Previous scene" title="Previous scene">⏮&#xFE0E;</button>
          <button type="button" class="np-btn np-play" id="np-play" aria-label="Pause" title="Pause the film">❚❚</button>
          <button type="button" class="np-btn" id="np-next" aria-label="Next scene" title="Next scene">⏭&#xFE0E;</button>
          <button type="button" class="np-btn" id="np-stop" aria-label="Stop the film" title="Stop the film and close this bar">✕&#xFE0E;</button>
        </div>
        <a class="np-back" id="np-back" href="#/kino">Back to film</a>
      </section>
    </div>
  </div>
  <script src="shell.js"></script>
  <script src="design/jdpi-documentary.js" defer></script>
</body>
</html>
