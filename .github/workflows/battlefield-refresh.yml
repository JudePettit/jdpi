name: Refresh Realtime Battlefield data
# UCDP publishes its candidate events monthly; checking weekly picks up each release within days.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: battlefield-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node battlefield/scripts/fetch-latest.mjs
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/battlefield.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: battlefield/data/realtime.json
          message: 'Battlefield: refresh UCDP candidate events'
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    secrets: inherit
