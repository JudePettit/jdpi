name: Refresh Briefing stories
# Twice a day: fetch every publisher feed and roll the seven-day story store forward.
on:
  schedule:
    - cron: '5 6,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: briefing-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node briefing/scripts/build.mjs
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/briefing.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: briefing/data/latest.json
          message: 'Briefing: refresh stories'
  # Tests the whole suite on main as this refresh left it, and deploys that commit only if it passed (pages-deploy.yml).
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    with:
      deploy: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
