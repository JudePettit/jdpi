name: Refresh Trader Tracker data
# House trade reports and 13F filings arrive continuously; a weekly refresh keeps the tracker within days.
on:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node traders/scripts/build-congress.mjs
      - run: node traders/scripts/build-13f.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traders/data traders/scripts/ptr-cache.json
          git diff --cached --quiet || git commit -m "Trader Tracker: weekly refresh" && git pull --rebase && git push
