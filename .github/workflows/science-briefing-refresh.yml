name: Refresh Scientific Briefing
# Every six hours: fetch every journal and science-desk feed and roll the seven-day store forward.
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: science-briefing-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node science/scripts/build-briefing.mjs
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/science-briefing.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: science/briefing/data
          message: 'Scientific Briefing: refresh stories'
