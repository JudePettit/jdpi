<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-labelledby="hb-title hb-desc">
  <title id="hb-title">Highbrowse</title>
  <desc id="hb-desc">The Highbrowse wordmark: the word Highbrowse in a serif, its g and o drawn as two eyes under raised eyebrows, looking up and away.</desc>
  <!-- Path-drawn rather than set in Georgia: the eyes must sit exactly in the g's upper bowl and the o, and a <text> would
       fall back to another serif with other metrics wherever Georgia is missing (Android, Linux). Metrics: baseline 86,
       x-height 46 (x-line 40), caps 64 (22), ascenders 68 (18), the g's loop to 107.5; stems 10, hairlines 3.2-3.6,
       bracketed serifs 6 out from each stem. The letters are currentColor, so inline the SVG and it takes the page's ink
       on light and dark pages; standalone (an <img>) the svg:root rule below gives them the PRP ink. The whites
       (#f3f4f6) are inset 1.5 inside the counters, so on a dark page a dark ring parts them from the light letters; on a
       light page the ring is the page and vanishes. A spectacles' bridge across h-b-r was tried and dropped: at 200 px
       wide it read as a strike-through. The b, centred between the eyes, does the nose on its own. -->
  <style>svg:root{color:#14181f}</style>
  <g fill="currentColor">
    <!-- H -->
    <path d="M14 22H36V25.2Q30 25.2 30 29.2V51.5H66V29.2Q66 25.2 60 25.2V22H82V25.2Q76 25.2 76 29.2V78.8Q76 82.8 82 82.8V86H60V82.8Q66 82.8 66 78.8V56H30V78.8Q30 82.8 36 82.8V86H14V82.8Q20 82.8 20 78.8V29.2Q20 25.2 14 25.2Z"/>
    <!-- i -->
    <path d="M87 41L103 38V78.8Q103 82.8 109 82.8V86H87V82.8Q93 82.8 93 78.8V48Q93 44.2 87 44.2Z"/>
    <circle cx="98" cy="27" r="6"/>
    <!-- g: the upper bowl (the left eye), the ear, the link and the lower loop -->
    <path fill-rule="evenodd" d="M135 40a16.5 17 0 1 1 0 34a16.5 17 0 1 1 0-34zM135 43.6a9.7 13.4 0 1 0 0 26.8a9.7 13.4 0 1 0 0-26.8z"/>
    <path d="M146.5 42.5L160 40V44.5L149.5 47Z"/>
    <path d="M129 72.4C121.5 75.5 121 81 127 87.5" fill="none" stroke="currentColor" stroke-width="3.6"/>
    <path fill-rule="evenodd" d="M137 84.5a18 11.5 0 1 1 0 23a18 11.5 0 1 1 0-23zM137 88.8a11.4 7.4 0 1 0 0 14.8a11.4 7.4 0 1 0 0-14.8z"/>
    <!-- h -->
    <path d="M162 21L178 18V48.5C182 42.5 187 40 193 40C201 40 205 45 205 54V78.8Q205 82.8 211 82.8V86H189V82.8Q195 82.8 195 78.8V56C195 50 192.5 47 188 47C183.5 47 180 50 178 54V78.8Q178 82.8 184 82.8V86H162V82.8Q168 82.8 168 78.8V28Q168 24.2 162 24.2Z"/>
    <!-- b (the nose) -->
    <path fill-rule="evenodd" d="M215 21L231 18V48.5C234.5 42.5 239.5 39.5 245.5 39.5C256.5 39.5 264 49.5 264 63C264 77 255 86.5 243.5 86.5C238 86.5 234 84.5 231 81.5L226 87H221V28Q221 24.2 215 24.2ZM231 55C233 49 237 46.5 241.5 46.5C249 46.5 253.5 53 253.5 63.5C253.5 74 249 80 242 80C237 80 233.5 77.5 231 73Z"/>
    <!-- r -->
    <path d="M267 41L283 38V49C286 43.5 290 40 295 40C299.5 40 302 42.5 302 46C302 49 300 51 297 51C294.5 51 293 49.5 292.5 47.5C289 47.5 285.5 50.5 283 56V78.8Q283 82.8 291 82.8V86H267V82.8Q273 82.8 273 78.8V48Q273 44.2 267 44.2Z"/>
    <!-- o (the right eye) -->
    <path fill-rule="evenodd" d="M329 39.5a21 23.5 0 1 1 0 47a21 23.5 0 1 1 0-47zM329 43.1a12 19.9 0 1 0 0 39.8a12 19.9 0 1 0 0-39.8z"/>
    <!-- w: thick down-strokes, hairline up-strokes, serifs on the three tops -->
    <path d="M354 40H372V43.2H368L382 86H372L358 43.2H354Z"/>
    <path d="M375.2 86H378.8L391.8 40H388.2Z"/>
    <path d="M383 40H397V43.2H395L409 86H399L385 43.2H383Z"/>
    <path d="M402.2 86H405.8L418.8 40H415.2Z"/>
    <path d="M411 40H423V43.2H411Z"/>
    <!-- s: one contour, a thick spine between hairline arcs, with a beak at each end -->
    <path d="M457 40.5V52H453.8C453 47 449.5 43.6 444.2 43.6C439.6 43.6 437 46.2 437 49.6C437 53.4 440.5 55.6 446.5 58.4C454 62 458.6 66.4 458.6 73.6C458.6 81.8 452.6 86.5 443.6 86.5C438.2 86.5 433.2 84.8 431.6 83.4L429.5 85.6V74H432.7C434 80 437.6 82.9 443.4 82.9C448.2 82.9 451 80.6 451 77.2C451 73.2 447.6 71 441.6 68.2C434.2 64.8 430 60.6 430 53.2C430 45.2 436 40 444.4 40C450 40 453.6 41 457 40.5Z"/>
    <!-- e -->
    <path fill-rule="evenodd" d="M504.5 61.6H474.6C474.6 75.5 479.5 82.8 487.5 82.8C493.5 82.8 498 79 501 74L504 75.5C500.5 82.5 494.5 86.5 486 86.5C474 86.5 465.5 77 465.5 63C465.5 49.5 473.5 39.5 485.5 39.5C496.5 39.5 504.5 47.5 504.5 61.6ZM474.7 58H495.6C495.5 48.2 491.6 43.2 485.6 43.2C479.6 43.2 475.2 48.5 474.7 58Z"/>
    <!-- Eyebrows, raised: brush strokes with a rounded head over the nose and a thin tail outward. The left is the
         right one mirrored, scaled to the smaller g (0.85) and set 3 lower, so the right brow is the arched one. -->
    <path d="M154.6 33C155 29.5 152.9 26.5 149.5 25C141 20.5 128.2 19.5 115.5 31C127.4 24.5 139.3 25.5 150.3 31.5C152 32.5 154.1 34.5 154.6 33Z"/>
    <path d="M306 30C305.5 26.5 308 23.5 312 22C322 17.5 337 16.5 352 28C338 21.5 324 22.5 311 28.5C309 29.5 306.5 31.5 306 30Z"/>
  </g>
  <!-- The eyes: whites in the counters, pupils up and to the right (a look down the nose at the rest of the word) -->
  <g fill="#f3f4f6">
    <ellipse cx="135" cy="57" rx="8.2" ry="11.9"/>
    <ellipse cx="329" cy="63" rx="10.5" ry="18.4"/>
  </g>
  <g fill="#14181f">
    <circle cx="138" cy="51" r="5"/>
    <circle cx="333" cy="53.5" r="5.8"/>
  </g>
</svg>
