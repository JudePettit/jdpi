name: Refresh the Scientific, Economics and Digital Briefings
# Every six hours (01:45, 07:45, 13:45 and 19:45 UTC: after arXiv's nightly announcement, at a minute no other job
# uses): fetch every feed of the three briefings and roll their seven-day stores forward, then commit all three at
# once. Each briefing is built and tested on its own: one that fails, or fails its tests, is put back as it was and
# the other two are still committed; the run then ends red. One commit instead of three keeps the site's deploys (one
# per commit) to about eight a day.
# GitHub drops scheduled runs when it is busy: after its 20:29 UTC run on 22 November 2026 it started this one only
# about twice a day, so the briefings were up to almost 17 hours old (02:41 to 19:31 UTC on 23 November; a reader saw
# "13 hours old" on 25 November) on pages that say they are refreshed every six hours. The cron stays as it is (the
# pages read "every six hours" from it: design/prp-freshness.js). Test and deploy also starts this one when it finishes
# after a push to main (workflow_run), which GitHub's timetable does not hold up; such a run refreshes only when the
# newest of the three stores is five hours old or more. Otherwise its first job cancels the run, which then neither
# commits nor deploys (so a grey, cancelled run in Actions is normal). This only helps after a push: the refreshes' own
# commits start nothing, so between pushes the stores can still be as old as GitHub's timetable leaves them. The other
# scheduled workflows are not in the chain: GitHub has thinned them into the same two windows a day, so a run they
# started came within an hour of this one's own run and refreshed and deployed a second time. The daily freshness check
# counts only the scheduled runs.
on:
  schedule:
    - cron: '45 1-23/6 * * *'
  workflow_run:
    workflows:
      - Test and deploy
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: briefings-refresh
  cancel-in-progress: false
jobs:
  # A run Test and deploy started goes on only when the last refresh is five hours old or more, and never after a pull
  # request's tests. Otherwise it cancels itself, so the deploy below (which runs unless the run is cancelled) is
  # skipped too. If the cancel never comes (or gh cannot ask for it), this job fails: the refresh is skipped, but the
  # deploy still tests and deploys main as it stands, as after any failed refresh. Scheduled and hand-started runs pass
  # straight through.
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          sparse-checkout: |
            science/briefing/data/stories.json
            econ/briefing/data/stories.json
            digital/briefing/data/stories.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_run'
        with:
          node-version: 24
      - name: Go on only if the last refresh is five hours old or more
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM: ${{ github.event.workflow_run.event }}
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
        run: |
          due=$(node -p 'const at = ["science", "econ", "digital"].map(b => { try { return Date.parse(require(`./${b}/briefing/data/stories.json`).generated) || 0; } catch { return 0; } }); Date.now() - Math.max(...at) >= 5 * 3600e3')
          if [ "$UPSTREAM" != "pull_request" ] && [ "$due" = "true" ]; then
            echo "The last refresh is five hours old or more: refreshing now."; exit 0
          fi
          echo "::notice::No refresh due (the last is under five hours old, or a pull request's tests finished): this run cancels itself."
          gh run cancel "$RUN" --repo "$GITHUB_REPOSITORY"
          sleep 120
          echo "::error::The run did not cancel itself in two minutes: the refresh is skipped, but main is still tested and deployed as it stands."; exit 1
  refresh:
    needs: due
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the Scientific Briefing
        id: science
        continue-on-error: true
        run: node science/scripts/build-briefing.mjs
      - name: Test the Scientific Briefing
        id: sciencetest
        if: steps.science.outcome == 'success'
        continue-on-error: true
        env:
          PRP_PAGES: '0'
        run: node --test tests/science-briefing.test.mjs
      - name: Build the Economics Briefing
        id: econ
        continue-on-error: true
        run: node econ/scripts/build-briefing.mjs
      - name: Test the Economics Briefing
        id: econtest
        if: steps.econ.outcome == 'success'
        continue-on-error: true
        env:
          PRP_PAGES: '0'
        run: node --test tests/econ-briefing.test.mjs
      - name: Build the Digital Briefing
        id: digital
        continue-on-error: true
        run: node digital/scripts/build-briefing.mjs
      - name: Test the Digital Briefing
        id: digitaltest
        if: steps.digital.outcome == 'success'
        continue-on-error: true
        env:
          PRP_PAGES: '0'
        run: node --test tests/digital-briefing.test.mjs
      - name: Put back any briefing that could not be refreshed
        env:
          SCIENCE: ${{ steps.sciencetest.outcome }}
          ECON: ${{ steps.econtest.outcome }}
          DIGITAL: ${{ steps.digitaltest.outcome }}
        run: |
          failed=""
          for pair in "science:$SCIENCE" "econ:$ECON" "digital:$DIGITAL"; do
            name=${pair%%:*}; outcome=${pair#*:}
            if [ "$outcome" != "success" ]; then
              git checkout -q -- "$name/briefing/data"; git clean -fdq -- "$name/briefing/data"
              failed="$failed $name"
            fi
          done
          echo "FAILED=$failed" >> "$GITHUB_ENV"
      - uses: ./.github/actions/commit-data
        with:
          paths: science/briefing/data econ/briefing/data digital/briefing/data
          message: 'Briefings: refresh the Scientific, Economics and Digital stories'
      - name: Fail the run if a briefing was not refreshed
        if: env.FAILED != ''
        run: |
          echo "::error::Not refreshed (the build or its tests failed, see those steps):$FAILED. The others were committed."
          exit 1
  # Tests the whole suite on main as this refresh left it, and deploys that commit only if it passed (pages-deploy.yml).
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    with:
      deploy: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
