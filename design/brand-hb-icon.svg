<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="hbi-title hbi-desc">
  <title id="hbi-title">Highbrowse</title>
  <desc id="hbi-desc">The Highbrowse icon: the hard-hatted Vitruvian figure, a monocle in one eye, peering over a newspaper, in Leonardo's circle.</desc>
  <!-- The reduction of design/brand-hb.svg for 16 to 40 px (the sidebar draws it at 20), on design/brand-vm-icon.svg's
       grid: its circle, its raised arms and its legs, with the newspaper held across the body by the hands at its edges.
       The type becomes what reads at that size, a black nameplate over two lines of columns; the face keeps two eyes
       looking up and the amber monocle, which still show at 20 px on a fine screen and as a glint at 16. -->
  <rect width="32" height="32" rx="6" fill="#14181f"/>
  <circle cx="16" cy="17" r="13.5" fill="none" stroke="#f3f4f6" stroke-opacity=".45" stroke-width="1.4"/>
  <g fill="none" stroke="#f3f4f6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.2 15.5L5.6 9.4M17.8 15.5L26.4 9.4"/>
    <path d="M15 20L8.2 27.2M17 20L23.8 27.2M15 20L13 28.8M17 20L19 28.8"/>
  </g>
  <circle cx="16" cy="12" r="3.1" fill="#f3f4f6"/>
  <g fill="#14181f">
    <circle cx="15" cy="12.1" r=".75"/>
    <circle cx="17.5" cy="12.1" r=".75"/>
  </g>
  <circle cx="17.3" cy="12.3" r="1.55" fill="none" stroke="#d9a35c" stroke-width=".8"/>
  <path d="M12 10a4 4 0 0 1 8 0z" fill="#d9a35c"/>
  <rect x="10.4" y="8.9" width="11.2" height="2.1" rx="1.05" fill="#d9a35c"/>
  <rect x="4.6" y="14" width="22.8" height="9.4" rx=".8" fill="#e9edf2" stroke="#14181f" stroke-width=".9"/>
  <rect x="7" y="15.6" width="18" height="2.3" fill="#14181f"/>
  <g fill="#5c6470">
    <rect x="7" y="19.2" width="8.2" height="1.1"/><rect x="16.8" y="19.2" width="8.2" height="1.1"/>
    <rect x="7" y="21.1" width="8.2" height="1.1"/><rect x="16.8" y="21.1" width="5.6" height="1.1"/>
  </g>
  <g fill="#f3f4f6" stroke="#14181f" stroke-width=".8">
    <circle cx="4.4" cy="15.7" r="1.6"/><circle cx="27.6" cy="15.7" r="1.6"/>
  </g>
</svg>
