name: Refresh Encyclopaedia entity layer
# Rebuilds lake/data monthly: mentions from every module, Wikidata facts and tags, Wikipedia summaries.
on:
  schedule:
    - cron: '31 3 3 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lake-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JudePettit/hp-retrospective
          path: hp-retrospective
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node lake/scripts/build.mjs --retro hp-retrospective
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/encyclopedia.test.mjs tests/kino.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: lake/data lake/scripts/summary-cache.json
          message: 'Encyclopaedia: monthly refresh of the entity layer'
