name: Deploy the site
# Publishes the current main to Cloudflare Pages by direct upload (no Pages build, so it never counts against the
# monthly build allowance). Called by ci.yml once the tests pass, and by every data refresh after its commit; it runs
# only while the repository variable DEPLOY_FROM_GITHUB is 'true', which is switched on once the CLOUDFLARE_API_TOKEN
# secret is set and Pages' own automatic deployments are switched off (otherwise the two would deploy twice).
on:
  workflow_call:
  workflow_dispatch:
concurrency:
  group: pages-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: vars.DEPLOY_FROM_GITHUB == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0a2b1580add4ec2edb8f3c49a538b43b
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::The CLOUDFLARE_API_TOKEN secret is not set."; exit 1; fi
          npx --yes wrangler@4 pages deploy . --project-name=jdpi --branch=main --commit-hash="$(git rev-parse HEAD)" --commit-message="$(git log -1 --pretty=%s)" --commit-dirty=true
