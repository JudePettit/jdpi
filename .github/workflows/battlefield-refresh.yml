name: Refresh Realtime Battlefield data
# UCDP publishes its candidate events monthly; checking weekly picks up each release within days.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: battlefield-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node battlefield/scripts/fetch-latest.mjs
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/battlefield.test.mjs
      - name: Was a new release taken in?
        id: release
        run: |
          if git diff --quiet -- battlefield/data/realtime.json; then echo "new=no" >> "$GITHUB_OUTPUT"; else echo "new=yes" >> "$GITHUB_OUTPUT"; fi
      # Month by Month marks the month this file holds: with a new release it is rebuilt and tested here, and committed
      # in the same commit, so the marks never fall behind the release they name. A failed rebuild, or one that fails its
      # tests, is thrown away; the marks kept are then tested with the new release, and if they fail too nothing is
      # committed (the deploy gate tests the whole suite on what a refresh leaves).
      - name: Rebuild Month by Month
        id: monthly
        if: steps.release.outputs.new == 'yes'
        continue-on-error: true
        run: node monthly/scripts/build.mjs
      - name: Test the new marks
        id: monthlytest
        if: steps.monthly.outcome == 'success'
        continue-on-error: true
        env:
          PRP_PAGES: '0'
        run: node --test tests/monthly.test.mjs
      - name: Throw away Month by Month's changes
        if: steps.monthly.outcome == 'failure' || steps.monthlytest.outcome == 'failure'
        run: |
          git checkout -- monthly/data
          git clean -fdq -- monthly/data
      - name: Test the marks kept with the new release
        if: steps.monthly.outcome == 'failure' || steps.monthlytest.outcome == 'failure'
        env:
          PRP_PAGES: '0'
        run: node --test tests/monthly.test.mjs
      # The deploy that follows runs package.json's whole "test" list on what this refresh commits. Its unit and data
      # tests run here first, on the same files and with the deploy's settings, so that a test elsewhere in the list that
      # the new data breaks stops this refresh (nothing is committed, the site keeps the last good data and goes on
      # publishing, and this run goes red, where the freshness check shows it) instead of every deploy after it.
      # Four files of the list (documentary, headlines, learning, platform) load playwright-core when they are read.
      - run: npm ci --ignore-scripts
      - name: Test the whole unit list on what this refresh would commit
        env:
          PRP_PAGES: '0'
          PRP_CPU_LIMIT_MS: '80'
        run: node tests/tools/run.mjs unit
      - uses: ./.github/actions/commit-data
        with:
          paths: battlefield/data/realtime.json battlefield/data/realtime.head.json monthly/data
          message: 'Battlefield: refresh UCDP candidate events'
      - name: Fail the run if Month by Month was not rebuilt
        if: steps.monthly.outcome == 'failure' || steps.monthlytest.outcome == 'failure'
        run: |
          echo "::error::The Month by Month rebuild or its tests failed (see those steps); Realtime Battlefield was committed with the marks kept."
          exit 1
  # Tests the whole suite on main as this refresh left it, and deploys that commit only if it passed (pages-deploy.yml).
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    with:
      deploy: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
