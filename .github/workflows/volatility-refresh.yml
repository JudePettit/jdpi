name: Refresh Geopolitical Volatility
# GDELT publishes a quarter-hour event export; once a UTC day is complete it is scored the next morning.
on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node volatility/scripts/ingest.mjs --days 7
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A volatility/data
          git diff --cached --quiet || git commit -m "Volatility: score latest GDELT day" && git pull --rebase && git push
