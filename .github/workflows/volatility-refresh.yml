name: Refresh Geopolitical Volatility
# GDELT publishes a quarter-hour event export; once a UTC day is complete it is scored the next morning.
on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: volatility-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node volatility/scripts/ingest.mjs --days 7
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/volatility.test.mjs
      # The deploy that follows runs package.json's whole "test" list on what this refresh commits. Its unit and data
      # tests run here first, on the same files and with the deploy's settings, so that a test elsewhere in the list that
      # the new data breaks stops this refresh (nothing is committed, the site keeps the last good data and goes on
      # publishing, and this run goes red, where the freshness check shows it) instead of every deploy after it.
      # Four files of the list (documentary, headlines, learning, platform) load playwright-core when they are read.
      - run: npm ci --ignore-scripts
      - name: Test the whole unit list on what this refresh would commit
        env:
          PRP_PAGES: '0'
          PRP_CPU_LIMIT_MS: '80'
        run: node tests/tools/run.mjs unit
      - uses: ./.github/actions/commit-data
        with:
          paths: volatility/data
          message: 'Volatility: score latest GDELT day'
      - name: Fail when two nights in a row could not complete their GDELT day
        run: |
          latest=$(node -p "require('./volatility/data/index.json').latest")
          limit=$(date -u -d '2 days ago' +%F)
          if [[ ! "$latest" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || "$latest" < "$limit" ]]; then
            echo "::error title=Volatility::The newest complete GDELT day is $latest, older than the day before yesterday ($limit): two nights in a row could not complete their GDELT day (see the warnings above)."
            exit 1
          fi
          echo "Newest complete GDELT day: $latest"
  # Tests the whole suite on main as this refresh left it, and deploys that commit only if it passed (pages-deploy.yml).
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    with:
      deploy: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
