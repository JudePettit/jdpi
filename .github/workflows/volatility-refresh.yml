name: Refresh Geopolitical Volatility
# GDELT publishes a quarter-hour event export; once a UTC day is complete it is scored the next morning.
on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: volatility-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node volatility/scripts/ingest.mjs --days 7
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/volatility.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: volatility/data
          message: 'Volatility: score latest GDELT day'
      - name: Fail when two nights in a row could not complete their GDELT day
        run: |
          latest=$(node -p "require('./volatility/data/index.json').latest")
          limit=$(date -u -d '2 days ago' +%F)
          if [[ ! "$latest" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || "$latest" < "$limit" ]]; then
            echo "::error title=Volatility::The newest complete GDELT day is $latest, older than the day before yesterday ($limit): two nights in a row could not complete their GDELT day (see the warnings above)."
            exit 1
          fi
          echo "Newest complete GDELT day: $latest"
