name: Refresh Economics Briefing
# Every six hours: fetch every economics research and news feed and roll the seven-day store forward.
on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: econ-briefing-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node econ/scripts/build-briefing.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add econ/briefing/data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Economics Briefing: refresh stories"
          git pull --rebase
          git push
