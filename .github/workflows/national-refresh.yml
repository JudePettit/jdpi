name: Refresh National Analysis data
# World Bank indicators are revised several times a year; JDP-I's leadership and conflict data change monthly.
on:
  schedule:
    - cron: '47 3 5 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: national-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JudePettit/hp-retrospective
          path: hp-retrospective
      # Political Atlas names, for each country it covers, the office that holds the most power (its executive.leader):
      # the current leader is that office's holder.
      - uses: actions/checkout@v4
        with:
          repository: JudePettit/political-atlas
          path: political-atlas
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node national/scripts/build.mjs --retro hp-retrospective --atlas political-atlas
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/national.test.mjs tests/kino.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: national/data
          message: 'National Analysis: monthly data refresh'
  # Tests the whole suite on main as this refresh left it, and deploys that commit only if it passed (pages-deploy.yml).
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    with:
      deploy: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
