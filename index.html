<!doctype html>
<html lang="en" class="jdpi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>JDP-I</title>
  <meta name="description" content="JDP-I: an integrated platform of intelligence suites covering geopolitics (Q), history and politics (H&P), and finance and economics (F&E).">
  <link rel="icon" href="design/brand-jdpi.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="design/jdpi.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <a class="brand" href="#/">
        <img src="design/brand-jdpi.svg" alt="" width="34" height="34">
        <span>
          <span class="brand-name">JDP-I</span>
          <small>Intelligence platform</small>
        </span>
      </a>
      <div class="find">
        <input id="find" type="search" placeholder="Find a module…" autocomplete="off" aria-label="Find a module">
        <kbd>/</kbd>
      </div>
      <nav id="nav" aria-label="Suites and modules"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>

    <div class="main">
      <header class="top">
        <button class="menu" id="menu" type="button" aria-label="Open navigation" aria-controls="side" aria-expanded="false">☰</button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <section class="view" id="view" aria-live="polite"></section>
      <section class="frames" id="frames" hidden></section>
    </div>
  </div>
  <script src="shell.js"></script>
</body>
</html>
