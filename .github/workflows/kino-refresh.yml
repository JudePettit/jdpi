name: Refresh Kino
# Monthly: re-read the documentaries' Wikidata labels and image credits (Wikidata P18 and Wikimedia Commons licences)
# and rebuild kino/data/index.json and media.json. --refresh refetches cached entries older than 25 days; the cache is
# committed so that each run asks only for what is due.
on:
  schedule:
    - cron: '13 4 4 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kino-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node kino/scripts/build-index.mjs --refresh
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/kino.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: kino/data/index.json kino/data/media.json kino/data/iso.json kino/scripts/cache.json
          message: 'Kino: monthly Wikidata and Commons refresh'
