name: Refresh Economics Briefing
# Every six hours: fetch every economics research and news feed and roll the seven-day store forward.
on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: econ-briefing-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node econ/scripts/build-briefing.mjs
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/econ-briefing.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: econ/briefing/data
          message: 'Economics Briefing: refresh stories'
