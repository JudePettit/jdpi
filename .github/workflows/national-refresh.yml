name: Refresh National Analysis data
# World Bank indicators are revised several times a year; JDP-I's leadership and conflict data change monthly.
on:
  schedule:
    - cron: '47 4 5 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JudePettit/hp-retrospective
          path: hp-retrospective
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node national/scripts/build.mjs --retro hp-retrospective
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add national/data
          git diff --cached --quiet || git commit -m "National Analysis: monthly data refresh" && git pull --rebase && git push
