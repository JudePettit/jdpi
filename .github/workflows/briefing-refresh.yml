name: Refresh Briefing stories
# Twice a day: fetch every publisher feed and roll the seven-day story store forward.
on:
  schedule:
    - cron: '5 6,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node briefing/scripts/build.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefing/data/latest.json
          git diff --cached --quiet || git commit -m "Briefing: refresh stories" && git pull --rebase && git push
