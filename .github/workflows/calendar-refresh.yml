name: Refresh the Realtime and Historical Calendars
# Resignations, votes, court rulings, protests, sanctions and the like come from Wikipedia's "Current events" portal,
# so they go stale within days; summits, referendums and elections are scheduled from Wikipedia's lists, its national
# electoral calendars, Wikidata and the Political Atlas. If a source fails and a type of event would lose more than
# half its records, the build stops without writing, so this run fails instead of committing.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JudePettit/hp-retrospective
          path: hp-retrospective
      - uses: actions/checkout@v4
        with:
          repository: JudePettit/political-atlas
          path: political-atlas
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node calendar/scripts/build-events.mjs hp-retrospective/data/countries.json --atlas=political-atlas
      - run: node calendar/scripts/enrich-summaries.mjs
      - name: Test the new calendars
        env:
          PRP_PAGES: '0'
        run: node --test tests/calendar.test.mjs
      # Integration Hub: the calendars as iCalendar files, plus the data catalogue, its shards, the Encyclopaedia name index,
      # the country profiles, openapi.json and llms.txt, rebuilt from today's data and tested. A failed rebuild, or one that
      # fails its tests, never blocks the calendars: its files are thrown away, the calendars are committed, and the run
      # then ends red.
      - name: Rebuild the Integration Hub catalogue and calendar files
        id: hub
        continue-on-error: true
        run: node integration/scripts/build-catalog.mjs --quiet
      - name: Test the new catalogue
        id: hubtest
        if: steps.hub.outcome == 'success'
        continue-on-error: true
        env:
          PRP_PAGES: '0'
          PRP_CPU_LIMIT_MS: '80'
        run: node --test --test-concurrency=1 tests/integration-hub.test.mjs tests/data-analytics.test.mjs
      - name: Throw away the Integration Hub's changes
        if: steps.hub.outcome == 'failure' || steps.hubtest.outcome == 'failure'
        run: |
          git checkout -- integration llms.txt
          git clean -fdq -- integration
      - uses: ./.github/actions/commit-data
        with:
          paths: >-
            calendar/data calendar/scripts/summary-cache.json
            integration/catalog.json integration/openapi.json integration/data integration/feeds integration/skill llms.txt
          message: 'Calendars: daily event refresh'
      - name: Fail the run if the Integration Hub was not committed
        if: steps.hub.outcome == 'failure' || steps.hubtest.outcome == 'failure'
        run: |
          echo "::error::The Integration Hub rebuild or its tests failed (see those steps); the calendars were committed without it."
          exit 1
