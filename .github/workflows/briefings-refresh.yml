name: Refresh the Scientific, Economics and Digital Briefings
# Every six hours (01:45, 07:45, 13:45 and 19:45 UTC: after arXiv's nightly announcement, at a minute no other job
# uses): fetch every feed of the three briefings and roll their seven-day stores forward, then commit all three at
# once. Each briefing is built and tested on its own: one that fails, or fails its tests, is put back as it was and
# the other two are still committed; the run then ends red. One commit instead of three keeps the site's deploys (one
# per commit) to about eight a day.
on:
  schedule:
    - cron: '45 1-23/6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: briefings-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Scientific Briefing
        id: science
        continue-on-error: true
        run: node science/scripts/build-briefing.mjs
      - name: Test the Scientific Briefing
        id: sciencetest
        if: steps.science.outcome == 'success'
        continue-on-error: true
        env:
          PRP_PAGES: '0'
        run: node --test tests/science-briefing.test.mjs
      - name: Build the Economics Briefing
        id: econ
        continue-on-error: true
        run: node econ/scripts/build-briefing.mjs
      - name: Test the Economics Briefing
        id: econtest
        if: steps.econ.outcome == 'success'
        continue-on-error: true
        env:
          PRP_PAGES: '0'
        run: node --test tests/econ-briefing.test.mjs
      - name: Build the Digital Briefing
        id: digital
        continue-on-error: true
        run: node digital/scripts/build-briefing.mjs
      - name: Test the Digital Briefing
        id: digitaltest
        if: steps.digital.outcome == 'success'
        continue-on-error: true
        env:
          PRP_PAGES: '0'
        run: node --test tests/digital-briefing.test.mjs
      - name: Put back any briefing that could not be refreshed
        env:
          SCIENCE: ${{ steps.sciencetest.outcome }}
          ECON: ${{ steps.econtest.outcome }}
          DIGITAL: ${{ steps.digitaltest.outcome }}
        run: |
          failed=""
          for pair in "science:$SCIENCE" "econ:$ECON" "digital:$DIGITAL"; do
            name=${pair%%:*}; outcome=${pair#*:}
            if [ "$outcome" != "success" ]; then
              git checkout -q -- "$name/briefing/data"; git clean -fdq -- "$name/briefing/data"
              failed="$failed $name"
            fi
          done
          echo "FAILED=$failed" >> "$GITHUB_ENV"
      - uses: ./.github/actions/commit-data
        with:
          paths: science/briefing/data econ/briefing/data digital/briefing/data
          message: 'Briefings: refresh the Scientific, Economics and Digital stories'
      - name: Fail the run if a briefing was not refreshed
        if: env.FAILED != ''
        run: |
          echo "::error::Not refreshed (the build or its tests failed, see those steps):$FAILED. The others were committed."
          exit 1
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    secrets: inherit
