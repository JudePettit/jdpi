name: Refresh War Focus
# UCDP publishes candidate events monthly; this re-scores the ongoing wars and picks up new Wikidata battles.
on:
  schedule:
    - cron: '53 2 2 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: warfocus-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node battlefield/focus/scripts/build.mjs --cache /tmp/warfocus-src
      - name: Test the new data
        env:
          PRP_PAGES: '0'
        run: node --test tests/warfocus.test.mjs tests/kino.test.mjs
      - uses: ./.github/actions/commit-data
        with:
          paths: battlefield/focus/data
          message: 'War Focus: refresh UCDP events and battles'
  # Tests the whole suite on main as this refresh left it, and deploys that commit only if it passed (pages-deploy.yml).
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages-deploy.yml
    with:
      deploy: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
