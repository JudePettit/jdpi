name: Refresh Timeline of Progress
# Monthly: re-read the facts behind the curated breakthroughs from Wikidata (people, life dates, institutions, places)
# and rebuild science/progress/data/events.json. --refresh refetches cached items older than 25 days; the cache is
# committed so that each run asks Wikidata only for what is due.
on:
  schedule:
    - cron: '23 4 3 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: progress-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node science/scripts/build-progress.mjs --refresh
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science/progress/data science/scripts/progress-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Timeline of Progress: monthly Wikidata refresh"
            git pull --rebase
            git push
          fi
