name: Refresh Realtime Battlefield data
# UCDP publishes its candidate events monthly; checking weekly picks up each release within days.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node battlefield/scripts/fetch-latest.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add battlefield/data/realtime.json
          git diff --cached --quiet || git commit -m "Battlefield: refresh UCDP candidate events" && git pull --rebase && git push
